<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | My project</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  <!-- KEYBOARD-FIX -->
    <script>
      (function() {
        // 1. Block Space/Backspace/Arrow/Tab from reaching Unity when overlay is hidden
        var BLOCK = ['Space','Backspace','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab'];
        function onKey(e) {
          var el = document.activeElement;
          if (el && (el.id === 'kor-ime' || el.tagName === 'TEXTAREA' || el.tagName === 'INPUT')) return;
          var wrap = document.getElementById('kor-ime-wrap');
          if (wrap && wrap.style.display !== 'none') return;
          if (BLOCK.indexOf(e.code) !== -1) e.preventDefault();
        }
        window.addEventListener('keydown', onKey, true);
        window.addEventListener('keyup',   onKey, true);

        // 2. Unity 6 의 window-level capture handler 가 kor-ime 를 타깃으로 한
        //    keydown/keyup/keypress 에 preventDefault() 를 호출하면 영어·한글 입력이 차단된다.
        //    kor-ime 가 타깃인 키 이벤트에서는 무조건 preventDefault() 를 무시한다.
        var _origPD = Event.prototype.preventDefault;
        Event.prototype.preventDefault = function() {
          if ((this.type === 'keydown' || this.type === 'keyup' || this.type === 'keypress') &&
              this.target && this.target.id === 'kor-ime') {
            return;
          }
          return _origPD.call(this);
        };

        // 3. Redirect canvas focus to textarea when Korean overlay is active.
        //    Registered before Unity loads (capture phase) so it fires first.
        document.addEventListener('focus', function(e) {
          if (!window._korOverlayActive) return;
          var el = e.target;
          if (!el) return;
          if (el.tagName === 'CANVAS' || el.id === 'unity-canvas') {
            e.stopPropagation();
            el.blur();
            var ta = document.getElementById('kor-ime');
            if (ta) ta.focus();
          }
        }, true);

        // 4. Canvas auto-focus: itch.io iframe 포커스 지원.
        //    Korean overlay 가 없을 때 click/tap 시 canvas 에 포커스를 부여한다.
        document.addEventListener('pointerdown', function() {
          if (window._korOverlayActive) return;
          var c = document.querySelector('#unity-canvas') || document.querySelector('canvas');
          if (c) c.focus();
        }, true);

        // AUDIO-FIX: Unity 6 WebGL + itch.io iframe 오디오 언락
        // AudioContext 생성자를 인터셉트해 어떤 경로로 만들어지든 추적 후 재개
        (function() {
          var _ctxList = [];
          var OrigAC = window.AudioContext || window.webkitAudioContext;
          if (OrigAC) {
            var PatchedAC = function(opts) {
              var c = new OrigAC(opts); _ctxList.push(c); return c;
            };
            PatchedAC.prototype = OrigAC.prototype;
            window.AudioContext = PatchedAC;
            if (window.webkitAudioContext) window.webkitAudioContext = PatchedAC;
          }
          function resumeAll() {
            _ctxList.forEach(function(c) {
              try { if (c.state === 'suspended') c.resume(); } catch(e) {}
            });
            if (window.WEBAudio && window.WEBAudio.audioContext)
              try { window.WEBAudio.audioContext.resume(); } catch(e) {}
            var ui = window.unityInstance, m = ui && ui.Module;
            if (m) {
              try { if (m.ctx) m.ctx.resume(); } catch(e) {}
              try { if (m.WEBAudio && m.WEBAudio.audioContext) m.WEBAudio.audioContext.resume(); } catch(e) {}
            }
          }
          ['pointerdown','click','keydown','touchstart'].forEach(function(evt) {
            document.addEventListener(evt, resumeAll, true);
          });
          setTimeout(function() {
            var t = setInterval(function() { resumeAll(); }, 500);
            setTimeout(function() { clearInterval(t); }, 30000);
          }, 5000);
        })();
      })();
    </script>
    </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">My project</div>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebGL-Build.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGL-Build.data.unityweb",
        frameworkUrl: buildUrl + "/WebGL-Build.framework.js.unityweb",
        codeUrl: buildUrl + "/WebGL-Build.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "My project",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      // config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;


      } else {
        // itch.io 임베드(1280x720, 16:9)를 꽉 채우도록 반응형 처리.
        // 기존 960x600(16:10) 고정은 iframe 안에서 여백이 생기고 종횡비가 어긋난다.
        // .unity-mobile CSS(container fixed 100%, canvas 100%)를 재사용해 컨테이너째 채운다.
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
              }).then((unityInstance) => {
                window.unityInstance = unityInstance;
                var _c = document.querySelector('#unity-canvas') || document.querySelector('canvas'); if (_c) _c.focus();
                document.querySelector("#unity-loading-bar").style.display = "none";
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                  unityInstance.SetFullscreen(1);
                };

              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);

    </script>
  </body>
</html>
